[project]
name = "racoon"
version = "0.1.0"
description = "Stock explorer: yfinance -> PostgreSQL -> FastAPI -> React"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racoon"]

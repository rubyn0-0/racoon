# Used by the `alembic` command line (cd src/backend; uv run alembic ...). The app itself builds the same
# configuration in racoon.db.alembic_config(), so there is one place that says where migrations live.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
